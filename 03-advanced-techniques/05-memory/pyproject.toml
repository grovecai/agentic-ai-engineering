[project]
name = "lesson-memory-systems"
version = "0.1.0"
description = "Three-tier agent memory — working, episodic, and semantic persistence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.76.0",
    "chromadb>=0.5.0",
    "common",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py311"
